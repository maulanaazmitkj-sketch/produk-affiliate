<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Produk Affiliate</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px 60px;
    }

    .header {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-top: 7px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
      margin-left: 8px;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .product img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .product-info {
      padding: 14px;
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-date {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-email {
      font-size: 13px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
    }

    .file-name {
      font-size: 12px;
      color: #6b7280;
      margin-top: -8px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="topbar">
      <div>
        <h1>🗂️ Database Produk Affiliate</h1>
        <div class="subtitle">
          Simpan produk yang pernah kamu test supaya tidak beli produk yang sama lagi.
        </div>
      </div>

      <button id="logoutBtn" class="secondary hidden">
        Logout
      </button>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="authCard" class="card">

    <h2>🔐 Login</h2>

    <div id="authMessage"></div>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="email kamu"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="minimal 6 karakter"
    >

    <button id="loginBtn" class="primary">
      Login
    </button>

    <button id="signupBtn" class="secondary">
      Buat Akun
    </button>

  </div>


  <!-- APP -->
  <div id="app" class="hidden">

    <div class="card">

      <div class="topbar">
        <h2>➕ Tambah Produk</h2>

        <div class="user-email" id="userEmail"></div>
      </div>

      <div id="productMessage"></div>

      <label>Foto / Screenshot Produk</label>

      <input
        type="file"
        id="productImage"
        accept="image/*"
      >

      <div id="fileName" class="file-name"></div>

      <label>Nama Produk</label>

      <input
        type="text"
        id="productName"
        placeholder="Contoh: Lampu Camping Portable"
      >

      <label>Metrics / Data Produk (opsional)</label>

      <textarea
        id="metrics"
        placeholder="Contoh:
Harga: 79.000
GMV: 250 juta
Terjual: 12.000
Creator: 850
Komisi: 5%"
      ></textarea>

      <label>Catatan (opsional)</label>

      <textarea
        id="notes"
        placeholder="Contoh: Pernah test 2 video, view rendah."
      ></textarea>

      <button id="saveBtn" class="primary">
        💾 Simpan Produk
      </button>

    </div>


    <div class="card">

      <div class="topbar">
        <h2>📦 Produk yang Sudah Disimpan</h2>

        <button id="refreshBtn" class="secondary">
          🔄 Refresh
        </button>
      </div>

      <div id="products" class="products"></div>

    </div>

  </div>

</div>


<script>

  /*
  =====================================================
  SUPABASE CONFIG
  =====================================================
  */

  const SUPABASE_URL =
    "https://dyaaypnctyekibmlzali.supabase.co";

  /*
  GANTI bagian di bawah dengan PUBLISHABLE KEY
  dari Supabase kamu.
  JANGAN gunakan Secret Key.
  */

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_T_hZuh-AjSEeJjh7wziTxg_grGH1XVj";


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /*
  =====================================================
  ELEMENT
  =====================================================
  */

  const authCard = document.getElementById("authCard");
  const app = document.getElementById("app");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const authMessage = document.getElementById("authMessage");

  const productImage = document.getElementById("productImage");
  const productName = document.getElementById("productName");
  const metrics = document.getElementById("metrics");
  const notes = document.getElementById("notes");

  const saveBtn = document.getElementById("saveBtn");
  const productMessage = document.getElementById("productMessage");

  const productsContainer = document.getElementById("products");
  const refreshBtn = document.getElementById("refreshBtn");

  const userEmail = document.getElementById("userEmail");
  const fileName = document.getElementById("fileName");


  /*
  =====================================================
  HELPER MESSAGE
  =====================================================
  */

  function showMessage(element, text, type) {

    element.innerHTML =
      `<div class="message ${type}">${text}</div>`;

  }


  /*
  =====================================================
  FILE NAME
  =====================================================
  */

  productImage.addEventListener("change", function() {

    if (productImage.files.length > 0) {

      fileName.textContent =
        "File: " + productImage.files[0].name;

    } else {

      fileName.textContent = "";

    }

  });


  /*
  =====================================================
  SIGN UP
  =====================================================
  */

  signupBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

      showMessage(
        authMessage,
        "Masukkan email dan password.",
        "error"
      );

      return;
    }

    if (password.length < 6) {

      showMessage(
        authMessage,
        "Password minimal 6 karakter.",
        "error"
      );

      return;
    }

    signupBtn.disabled = true;

    const { error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    signupBtn.disabled = false;

    if (error) {

      showMessage(
        authMessage,
        error.message,
        "error"
      );

      return;
    }

    showMessage(
      authMessage,
      "Akun berhasil dibuat. Kalau diminta konfirmasi email, buka email kamu lalu klik link konfirmasi.",
      "success"
    );

  });


  /*
  =====================================================
  LOGIN
  =====================================================
  */

  loginBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

      showMessage(
        authMessage,
        "Masukkan email dan password.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    loginBtn.disabled = false;

    if (error) {

      showMessage(
        authMessage,
        error.message,
        "error"
      );

      return;
    }

    authMessage.innerHTML = "";

  });


  /*
  =====================================================
  LOGOUT
  =====================================================
  */

  logoutBtn.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

  });


  /*
  =====================================================
  AUTH STATE
  =====================================================
  */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

      if (session) {

        authCard.classList.add("hidden");
        app.classList.remove("hidden");
        logoutBtn.classList.remove("hidden");

        userEmail.textContent =
          session.user.email;

        await loadProducts();

      } else {

        authCard.classList.remove("hidden");
        app.classList.add("hidden");
        logoutBtn.classList.add("hidden");

      }

    }
  );


  /*
  =====================================================
  SAVE PRODUCT
  =====================================================
  */

  saveBtn.addEventListener("click", async function() {

    const name =
      productName.value.trim();

    const imageFile =
      productImage.files[0];

    const metricText =
      metrics.value.trim();

    const noteText =
      notes.value.trim();


    if (!name) {

      showMessage(
        productMessage,
        "Nama produk wajib diisi.",
        "error"
      );

      return;
    }


    if (!imageFile) {

      showMessage(
        productMessage,
        "Foto produk wajib dipilih.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "⏳ Menyimpan...";


    try {

      /*
      -------------------------------
      1. CEK USER
      -------------------------------
      */

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        throw new Error(
          "Session login tidak ditemukan."
        );

      }


      /*
      -------------------------------
      2. BUAT NAMA FILE
      -------------------------------
      */

      const fileExtension =
        imageFile.name.split(".").pop();

      const filePath =
        user.id +
        "/" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        fileExtension;


      /*
      -------------------------------
      3. UPLOAD FOTO
      -------------------------------
      */

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            imageFile
          );


      if (uploadError) {

        throw uploadError;

      }


      /*
      -------------------------------
      4. AMBIL URL FOTO
      -------------------------------
      */

      const {
        data: publicUrlData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(filePath);


      const imageUrl =
        publicUrlData.publicUrl;


      /*
      -------------------------------
      5. SIMPAN DATA PRODUK
      -------------------------------
      */

      const {
        error: insertError
      } =
        await supabaseClient
          .from("products")
          .insert({

            name: name,

            image_url: imageUrl,

            metrics: {
              raw: metricText
            },

            notes: noteText

          });


      if (insertError) {

        throw insertError;

      }


      /*
      -------------------------------
      6. RESET FORM
      -------------------------------
      */

      productImage.value = "";
      productName.value = "";
      metrics.value = "";
      notes.value = "";
      fileName.textContent = "";


      showMessage(
        productMessage,
        "✅ Produk berhasil disimpan!",
        "success"
      );


      await loadProducts();


    } catch (error) {

      console.error(error);

      showMessage(
        productMessage,
        "Gagal menyimpan: " +
        error.message,
        "error"
      );

    }


    saveBtn.disabled = false;
    saveBtn.textContent = "💾 Simpan Produk";

  });


  /*
  =====================================================
  LOAD PRODUCTS
  =====================================================
  */

  async function loadProducts() {

    productsContainer.innerHTML =
      `<div class="empty">⏳ Memuat produk...</div>`;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      productsContainer.innerHTML =
        `<div class="empty">
          Gagal mengambil data: ${error.message}
        </div>`;

      return;

    }


    if (!data || data.length === 0) {

      productsContainer.innerHTML =
        `<div class="empty">
          Belum ada produk.<br><br>
          Tambahkan produk pertama kamu di atas.
        </div>`;

      return;

    }


    productsContainer.innerHTML = "";


    data.forEach(function(product) {

      const card =
        document.createElement("div");

      card.className = "product";


      const image =
        document.createElement("img");

      image.src =
        product.image_url || "";

      image.alt =
        product.name;


      const info =
        document.createElement("div");

      info.className =
        "product-info";


      const name =
        document.createElement("div");

      name.className =
        "product-name";

      name.textContent =
        product.name;


      const date =
        document.createElement("div");

      date.className =
        "product-date";

      date.textContent =
        "Ditambahkan: " +
        new Date(
          product.created_at
        ).toLocaleDateString(
          "id-ID"
        );


      info.appendChild(name);
      info.appendChild(date);


      card.appendChild(image);
      card.appendChild(info);


      productsContainer.appendChild(card);

    });

  }


  /*
  =====================================================
  REFRESH
  =====================================================
  */

  refreshBtn.addEventListener(
    "click",
    loadProducts
  );


</script>

</body>
</html>
